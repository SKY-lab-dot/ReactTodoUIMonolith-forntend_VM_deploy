name: azurelandingzoneYMALpipeline

trigger:
- main

pool:
  name: Azurecicd

# ============================================================
# VARIABLES
# ============================================================

variables:
  terraformWorkingDirectory: ✅ $(Build.SourcesDirectory)

# ============================================================
# STAGES
# ============================================================

stages:

# ============================================================
# CI STAGE
# ============================================================

- stage: CI
  displayName: 'Terraform CI'

  jobs:

  - job: TerraformCI
    displayName: 'Terraform Init and Validate'

    steps:

    # --------------------------------------------------------
    # CHECKOUT MAIN REPOSITORY
    # --------------------------------------------------------

    - checkout: self
      displayName: 'Checkout Repository'

    # --------------------------------------------------------
    # SHOW REPOSITORY STRUCTURE
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Check Repository Structure'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "=========================================="
          Write-Host "Repository Information"
          Write-Host "=========================================="

          Write-Host "Build.SourcesDirectory:"
          Write-Host "$(Build.SourcesDirectory)"

          Write-Host ""
          Write-Host "Repository files/folders:"
          Write-Host "=========================================="

          Get-ChildItem "$(Build.SourcesDirectory)" -Recurse |
            Select-Object FullName |
            Format-Table -AutoSize

    # --------------------------------------------------------
    # CHECK TERRAFORM DIRECTORY
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Check Terraform Directory'
      inputs:
        targetType: 'inline'
        script: |
          $terraformPath = "$(terraformWorkingDirectory)"

          Write-Host "=========================================="
          Write-Host "Terraform Working Directory"
          Write-Host "=========================================="

          Write-Host $terraformPath

          if (-not (Test-Path $terraformPath)) {

              Write-Host ""
              Write-Host "##[error]Terraform directory does NOT exist!"
              Write-Host ""
              Write-Host "Expected directory:"
              Write-Host $terraformPath
              Write-Host ""

              Write-Host "Available directories:"
              Get-ChildItem "$(Build.SourcesDirectory)" -Directory -Recurse |
                Select-Object FullName |
                Format-Table -AutoSize

              exit 1
          }

          Write-Host ""
          Write-Host "Terraform directory found successfully."

          Write-Host ""
          Write-Host "Terraform files:"
          Get-ChildItem $terraformPath |
            Select-Object Name, FullName |
            Format-Table -AutoSize

    # --------------------------------------------------------
    # TERRAFORM VERSION
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Terraform Version'
      inputs:
        targetType: 'inline'
        script: |
          terraform version

    # --------------------------------------------------------
    # TERRAFORM INIT
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Terraform Init'
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(terraformWorkingDirectory)"

          Write-Host "Current directory:"
          Get-Location

          Write-Host ""
          Write-Host "Running Terraform Init..."

          terraform init

          if ($LASTEXITCODE -ne 0) {
              Write-Host "##[error]Terraform init failed."
              exit $LASTEXITCODE
          }

    # --------------------------------------------------------
    # TERRAFORM VALIDATE
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Terraform Validate'
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(terraformWorkingDirectory)"

          Write-Host "Running Terraform Validate..."

          terraform validate

          if ($LASTEXITCODE -ne 0) {
              Write-Host "##[error]Terraform validate failed."
              exit $LASTEXITCODE
          }

    # --------------------------------------------------------
    # TERRAFORM FORMAT
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Terraform Format Check'
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(terraformWorkingDirectory)"

          Write-Host "Running Terraform Format Check..."

          terraform fmt -check -recursive

          if ($LASTEXITCODE -ne 0) {
              Write-Host "##[error]Terraform formatting check failed."
              exit $LASTEXITCODE
          }


# ============================================================
# PLAN STAGE
# ============================================================

- stage: PLAN
  displayName: 'Terraform Plan'

  dependsOn: CI

  condition: succeeded()

  jobs:

  - job: TerraformPlan
    displayName: 'Terraform Plan'

    steps:

    # --------------------------------------------------------
    # CHECKOUT
    # --------------------------------------------------------

    - checkout: self
      displayName: 'Checkout Repository'

    # --------------------------------------------------------
    # CHECK TERRAFORM DIRECTORY
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Verify Terraform Directory'
      inputs:
        targetType: 'inline'
        script: |
          $terraformPath = "$(terraformWorkingDirectory)"

          if (-not (Test-Path $terraformPath)) {
              Write-Host "##[error]Terraform directory not found:"
              Write-Host $terraformPath
              exit 1
          }

          Write-Host "Terraform directory found:"
          Write-Host $terraformPath

    # --------------------------------------------------------
    # TERRAFORM INIT
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Terraform Init'
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(terraformWorkingDirectory)"

          terraform init

          if ($LASTEXITCODE -ne 0) {
              Write-Host "##[error]Terraform init failed."
              exit $LASTEXITCODE
          }

    # --------------------------------------------------------
    # TERRAFORM PLAN
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Terraform Plan'
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(terraformWorkingDirectory)"

          Write-Host "Running Terraform Plan..."

          terraform plan -out=tfplan

          if ($LASTEXITCODE -ne 0) {
              Write-Host "##[error]Terraform plan failed."
              exit $LASTEXITCODE
          }

    # --------------------------------------------------------
    # PUBLISH PLAN
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(terraformWorkingDirectory)\tfplan'
        artifact: 'terraform-plan'


# ============================================================
# APPLY STAGE
# ============================================================

- stage: APPLY
  displayName: 'Terraform Apply'

  dependsOn: PLAN

  condition: succeeded()

  jobs:

  - deployment: TerraformApply
    displayName: 'Terraform Apply'

    environment: 'terraform-production'

    strategy:

      runOnce:

        deploy:

          steps:

          # --------------------------------------------------
          # CHECKOUT
          # --------------------------------------------------

          - checkout: self
            displayName: 'Checkout Repository'

          # --------------------------------------------------
          # DOWNLOAD PLAN
          # --------------------------------------------------

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'
            inputs:
              artifact: 'terraform-plan'
              path: '$(Pipeline.Workspace)\terraform-plan'

          # --------------------------------------------------
          # CHECK TERRAFORM DIRECTORY
          # --------------------------------------------------

          - task: PowerShell@2
            displayName: 'Verify Terraform Directory'
            inputs:
              targetType: 'inline'
              script: |
                $terraformPath = "$(terraformWorkingDirectory)"

                if (-not (Test-Path $terraformPath)) {
                    Write-Host "##[error]Terraform directory not found:"
                    Write-Host $terraformPath
                    exit 1
                }

                Write-Host "Terraform directory found:"
                Write-Host $terraformPath

          # --------------------------------------------------
          # TERRAFORM INIT
          # --------------------------------------------------

          - task: PowerShell@2
            displayName: 'Terraform Init'
            inputs:
              targetType: 'inline'
              script: |
                Set-Location "$(terraformWorkingDirectory)"

                terraform init

                if ($LASTEXITCODE -ne 0) {
                    Write-Host "##[error]Terraform init failed."
                    exit $LASTEXITCODE
                }

          # --------------------------------------------------
          # TERRAFORM APPLY
          # --------------------------------------------------

          - task: PowerShell@2
            displayName: 'Terraform Apply'
            inputs:
              targetType: 'inline'
              script: |
                Set-Location "$(terraformWorkingDirectory)"

                $planFile = "$(Pipeline.Workspace)\terraform-plan\tfplan"

                if (-not (Test-Path $planFile)) {
                    Write-Host "##[error]Terraform plan file not found:"
                    Write-Host $planFile
                    exit 1
                }

                Write-Host "Applying Terraform plan..."

                terraform apply -auto-approve $planFile

                if ($LASTEXITCODE -ne 0) {
                    Write-Host "##[error]Terraform apply failed."
                    exit $LASTEXITCODE
                }

                Write-Host "=========================================="
                Write-Host "Terraform Apply Completed Successfully"
                Write-Host "=========================================="