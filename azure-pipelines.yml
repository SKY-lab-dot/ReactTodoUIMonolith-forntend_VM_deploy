trigger:
- main

pool:
  name: Azurecicd

steps:

- checkout: self

# Azure Login
- task: AzureCLI@3
  displayName: 'Azure CLI Login'
  inputs:
    connectionType: 'azureRM'
    azureSubscription: 'shailesh'
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az account show
      az group list --output table

# Check Terraform
- task: PowerShell@2
  displayName: 'Check Terraform Directory'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Current directory:"
      Get-Location

      Write-Host "Terraform files:"
      Get-ChildItem

# Terraform Init
- task: PowerShell@2
  displayName: 'Terraform Init'
  inputs:
    targetType: 'inline'
    script: |
      terraform init

# Terraform Validate
- task: PowerShell@2
  displayName: 'Terraform Validate'
  inputs:
    targetType: 'inline'
    script: |
      terraform validate

# Terraform Plan
- task: PowerShell@2
  displayName: 'Terraform Plan'
  inputs:
    targetType: 'inline'
    script: |
      terraform plan -out=tfplan

# Terraform Apply
- task: PowerShell@2
  displayName: 'Terraform Apply'
  inputs:
    targetType: 'inline'
    script: |
      terraform apply -auto-approve tfplan