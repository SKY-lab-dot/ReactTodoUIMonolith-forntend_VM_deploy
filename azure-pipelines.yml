trigger:
  branches:
    include:
      - main
      - feature*

pr:
  branches:
    include:
      - main

pool:
  name: Azurecicd

variables:
  - group: dev

stages:

# ============================================================
# STAGE 1 - VALIDATE + TFLINT + TFSEC
# ============================================================

- stage: Validate
  displayName: "Terraform Validate & Security"

  jobs:
    - job: ValidateJob
      displayName: "TFLint, tfsec & Terraform Validate"

      steps:

        # ======================================================
        # CHECKOUT
        # ======================================================

        - checkout: self
          displayName: "Checkout Repository"

        # ======================================================
        # INSTALL TERRAFORM
        # ======================================================

        - task: TerraformInstaller@1
          displayName: "Install Terraform"
          inputs:
            terraformVersion: "latest"

        # ======================================================
        # INSTALL TFLINT
        # ======================================================

        - task: PowerShell@2
          displayName: "Install TFLint"
          inputs:
            targetType: "inline"
            script: |

              Write-Host "========================================="
              Write-Host "Installing TFLint"
              Write-Host "========================================="

              $version = "v0.59.1"

              $url = "https://github.com/terraform-linters/tflint/releases/download/$version/tflint_windows_amd64.zip"

              $zip = "$(Agent.TempDirectory)\tflint.zip"

              $installDir = "$(Agent.TempDirectory)\tflint"

              Write-Host "Downloading TFLint..."
              Write-Host $url

              Invoke-WebRequest `
                -Uri $url `
                -OutFile $zip

              if (Test-Path $installDir) {
                  Remove-Item `
                    $installDir `
                    -Recurse `
                    -Force
              }

              New-Item `
                -ItemType Directory `
                -Path $installDir `
                -Force | Out-Null

              Expand-Archive `
                -Path $zip `
                -DestinationPath $installDir `
                -Force

              Write-Host "TFLint Version:"

              & "$installDir\tflint.exe" --version

        # ======================================================
        # RUN TFLINT
        # ======================================================

        - task: PowerShell@2
          displayName: "Run TFLint"
          inputs:
            targetType: "inline"
            script: |

              Write-Host "========================================="
              Write-Host "Running TFLint"
              Write-Host "========================================="

              Set-Location "$(Build.SourcesDirectory)"

              $tflint = "$(Agent.TempDirectory)\tflint\tflint.exe"

              if (!(Test-Path $tflint)) {
                  Write-Error "TFLint executable not found."
                  exit 1
              }

              & $tflint --init

              & $tflint

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "TFLint found issues."
                  exit 1
              }

              Write-Host "TFLint completed successfully."

        # ======================================================
        # INSTALL TFSEC
        # ======================================================

        - task: PowerShell@2
          displayName: "Install tfsec"
          inputs:
            targetType: "inline"
            script: |

              Write-Host "========================================="
              Write-Host "Installing tfsec"
              Write-Host "========================================="

              $version = "v1.28.14"

              $url = "https://github.com/aquasecurity/tfsec/releases/download/$version/tfsec-windows-amd64.exe"

              $tfsecDir = "$(Agent.TempDirectory)\tfsec"

              $tfsecPath = "$tfsecDir\tfsec.exe"

              if (Test-Path $tfsecDir) {
                  Remove-Item `
                    $tfsecDir `
                    -Recurse `
                    -Force
              }

              New-Item `
                -ItemType Directory `
                -Path $tfsecDir `
                -Force | Out-Null

              Write-Host "Downloading tfsec..."
              Write-Host $url

              Invoke-WebRequest `
                -Uri $url `
                -OutFile $tfsecPath

              Write-Host "tfsec Version:"

              & $tfsecPath --version

        # ======================================================
        # RUN TFSEC
        # ======================================================

        - task: PowerShell@2
          displayName: "Run tfsec"
          inputs:
            targetType: "inline"
            script: |

              Write-Host "========================================="
              Write-Host "Running tfsec Security Scan"
              Write-Host "========================================="

              Set-Location "$(Build.SourcesDirectory)"

              $tfsecPath = "$(Agent.TempDirectory)\tfsec\tfsec.exe"

              if (!(Test-Path $tfsecPath)) {
                  Write-Error "tfsec executable not found."
                  exit 1
              }

              & $tfsecPath .

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "tfsec found security issues."
                  exit 1
              }

              Write-Host "tfsec security scan completed successfully."

        # ======================================================
        # TERRAFORM INIT
        # ======================================================

        - task: TerraformTask@5
          displayName: "Terraform Init"
          inputs:
            provider: "azurerm"
            command: "init"

            backendServiceArm: "shailesh"

            backendAzureRmResourceGroupName: "$(TF_BACKEND_RESOURCE_GROUP)"

            backendAzureRmStorageAccountName: "$(TF_BACKEND_STORAGE_ACCOUNT)"

            backendAzureRmContainerName: "$(TF_BACKEND_CONTAINER)"

            backendAzureRmKey: "$(TF_BACKEND_KEY)"

        # ======================================================
        # TERRAFORM VALIDATE
        # ======================================================

        - task: TerraformTask@5
          displayName: "Terraform Validate"
          inputs:
            provider: "azurerm"
            command: "validate"


# ============================================================
# STAGE 2 - TERRAFORM PLAN
# ============================================================

- stage: Plan
  displayName: "Terraform Plan"

  dependsOn: Validate

  condition: succeeded()

  jobs:
    - job: PlanJob
      displayName: "Terraform Plan"

      steps:

        # ======================================================
        # CHECKOUT
        # ======================================================

        - checkout: self
          displayName: "Checkout Repository"

        # ======================================================
        # INSTALL TERRAFORM
        # ======================================================

        - task: TerraformInstaller@1
          displayName: "Install Terraform"
          inputs:
            terraformVersion: "latest"

        # ======================================================
        # TERRAFORM INIT
        # ======================================================

        - task: TerraformTask@5
          displayName: "Terraform Init"
          inputs:
            provider: "azurerm"
            command: "init"

            backendServiceArm: "shailesh"

            backendAzureRmResourceGroupName: "$(TF_BACKEND_RESOURCE_GROUP)"

            backendAzureRmStorageAccountName: "$(TF_BACKEND_STORAGE_ACCOUNT)"

            backendAzureRmContainerName: "$(TF_BACKEND_CONTAINER)"

            backendAzureRmKey: "$(TF_BACKEND_KEY)"

        # ======================================================
        # TERRAFORM PLAN
        # ======================================================

        - task: TerraformTask@5
          displayName: "Terraform Plan"
          inputs:
            provider: "azurerm"
            command: "plan"

            environmentServiceNameAzureRM: "shailesh"

            commandOptions: '-out="$(Build.ArtifactStagingDirectory)\tfplan"'

        # ======================================================
        # PUBLISH TERRAFORM PLAN
        # ======================================================

        - task: PublishPipelineArtifact@1
          displayName: "Publish Terraform Plan"
          inputs:
            targetPath: "$(Build.ArtifactStagingDirectory)\tfplan"
            artifact: "terraform-plan"


# ============================================================
# STAGE 3 - MANUAL APPROVAL
# ============================================================

- stage: Approval
  displayName: "Manual Approval"

  dependsOn: Plan

  condition: succeeded()

  jobs:
    - job: ManualApproval
      displayName: "Waiting for Manual Approval"

      pool: server

      steps:

        - task: ManualValidation@0
          displayName: "Approve Terraform Apply"

          timeoutInMinutes: 1440

          inputs:

            notifyUsers: |
              $(Build.RequestedForEmail)

            instructions: |
              Terraform Plan has completed successfully.

              Please review the Terraform Plan.

              Approve this validation to continue with Terraform Apply.

            onTimeout: "reject"


# ============================================================
# STAGE 4 - TERRAFORM APPLY
# ============================================================

- stage: Apply
  displayName: "Terraform Apply"

  dependsOn: Approval

  condition: succeeded()

  jobs:
    - job: ApplyJob
      displayName: "Terraform Apply"

      steps:

        # ======================================================
        # CHECKOUT
        # ======================================================

        - checkout: self
          displayName: "Checkout Repository"

        # ======================================================
        # INSTALL TERRAFORM
        # ======================================================

        - task: TerraformInstaller@1
          displayName: "Install Terraform"
          inputs:
            terraformVersion: "latest"

        # ======================================================
        # DOWNLOAD APPROVED PLAN
        # ======================================================

        - task: DownloadPipelineArtifact@2
          displayName: "Download Terraform Plan"
          inputs:
            buildType: "current"

            artifactName: "terraform-plan"

            targetPath: "$(Pipeline.Workspace)\terraform-plan"

        # ======================================================
        # TERRAFORM INIT
        # ======================================================

        - task: TerraformTask@5
          displayName: "Terraform Init"
          inputs:
            provider: "azurerm"
            command: "init"

            backendServiceArm: "shailesh"

            backendAzureRmResourceGroupName: "$(TF_BACKEND_RESOURCE_GROUP)"

            backendAzureRmStorageAccountName: "$(TF_BACKEND_STORAGE_ACCOUNT)"

            backendAzureRmContainerName: "$(TF_BACKEND_CONTAINER)"

            backendAzureRmKey: "$(TF_BACKEND_KEY)"

        # ======================================================
        # TERRAFORM APPLY
        # ======================================================

        - task: TerraformTask@5
          displayName: "Terraform Apply Approved Plan"
          inputs:
            provider: "azurerm"
            command: "apply"

            environmentServiceNameAzureRM: "shailesh"

            commandOptions: '"$(Pipeline.Workspace)\terraform-plan\tfplan"'