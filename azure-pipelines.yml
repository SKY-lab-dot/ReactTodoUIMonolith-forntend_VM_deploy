
name: azurelandingzoneYMALpipeline

trigger:
- main

pool:
  name: Azurecicd

stages:

# ============================================================
# CI STAGE
# ============================================================

- stage: CI
  displayName: 'Terraform CI'

  jobs:

  - job: CIWork
    displayName: 'Terraform CI Work'

    steps:

    # --------------------------------------------------------
    # CHECKOUT
    # --------------------------------------------------------

    - checkout: self
      displayName: 'Checkout Repository'

    # --------------------------------------------------------
    # SHOW REPOSITORY STRUCTURE
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Check Repository Structure'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "=========================================="
          Write-Host "Repository"
          Write-Host "=========================================="

          Write-Host "Source Directory:"
          Write-Host "$(System.DefaultWorkingDirectory)"

          Write-Host ""
          Write-Host "Terraform files:"

          Get-ChildItem `
            -Path "$(System.DefaultWorkingDirectory)" `
            -Recurse `
            -Filter "*.tf" `
            -File |
            Select-Object FullName

    # --------------------------------------------------------
    # AZURE LOGIN
    # --------------------------------------------------------

    - task: AzureCLI@3
      displayName: 'Azure CLI Login'
      inputs:
        connectionType: 'azureRM'
        azureSubscription: 'shailesh'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Azure Account:"
          az account show

          Write-Host ""
          Write-Host "Resource Groups:"
          az group list --output table

    # --------------------------------------------------------
    # TERRAFORM INSTALL
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: 'latest'

    # --------------------------------------------------------
    # CHECK TERRAFORM DIRECTORY
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Check Terraform Directory'
      inputs:
        targetType: 'inline'
        script: |
          $terraformDir = "$(System.DefaultWorkingDirectory)\Azure-Landing-Zone-Terraform_VM\Parent_Module\dev"

          Write-Host "Terraform Directory:"
          Write-Host $terraformDir

          if (-not (Test-Path $terraformDir)) {
              Write-Host "##[error]Terraform directory not found!"
              Write-Host ""
              Write-Host "Available directories:"
              Get-ChildItem `
                -Path "$(System.DefaultWorkingDirectory)" `
                -Directory `
                -Recurse |
                Select-Object FullName

              exit 1
          }

          Write-Host "Terraform directory found."

          Write-Host ""
          Write-Host "Terraform files:"
          Get-ChildItem $terraformDir

    # --------------------------------------------------------
    # TERRAFORM INIT
    # --------------------------------------------------------

    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)\Azure-Landing-Zone-Terraform_VM\Parent_Module\dev'
        backendServiceArm: 'shailesh'
        backendAzureRmResourceGroupName: 'sit'
        backendAzureRmStorageAccountName: 'sitterraformstate2026'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'sit.terraform.tfstate'

    # --------------------------------------------------------
    # TERRAFORM VALIDATE
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Terraform Validate'
      inputs:
        targetType: 'inline'
        script: |
          $terraformDir = "$(System.DefaultWorkingDirectory)\Azure-Landing-Zone-Terraform_VM\Parent_Module\dev"

          Set-Location $terraformDir

          Write-Host "Current directory:"
          Get-Location

          Write-Host ""
          Write-Host "Running Terraform Validate..."

          terraform validate

          if ($LASTEXITCODE -ne 0) {
            Write-Host "##[error]Terraform validate failed."
            exit $LASTEXITCODE
          }

    # --------------------------------------------------------
    # TERRAFORM PLAN
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Terraform Plan'
      inputs:
        targetType: 'inline'
        script: |
          $terraformDir = "$(System.DefaultWorkingDirectory)\Azure-Landing-Zone-Terraform_VM\Parent_Module\dev"

          Set-Location $terraformDir

          Write-Host "Current directory:"
          Get-Location

          Write-Host ""
          Write-Host "Running Terraform Plan..."

          terraform plan `
            -input=false `
            -out="$(Build.ArtifactStagingDirectory)\tfplan"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "##[error]Terraform plan failed."
            exit $LASTEXITCODE
          }

    # --------------------------------------------------------
    # CHECK PLAN
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Check Terraform Plan File'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "=========================================="
          Write-Host "Terraform Plan File"
          Write-Host "=========================================="

          $planFile = "$(Build.ArtifactStagingDirectory)\tfplan"

          if (-not (Test-Path $planFile)) {
            Write-Host "##[error]Terraform plan file not found!"
            exit 1
          }

          Write-Host "Plan file found:"
          Write-Host $planFile

          Get-ChildItem "$(Build.ArtifactStagingDirectory)" -Recurse

    # --------------------------------------------------------
    # PUBLISH PLAN
    # --------------------------------------------------------

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Terraform Plan'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)\tfplan'
        ArtifactName: 'terraform-plan'
        publishLocation: 'Container'


# ============================================================
# CD STAGE
# ============================================================

- stage: CD
  displayName: 'Terraform CD'

  dependsOn: CI

  condition: succeeded()

  jobs:

  - job: CDWork
    displayName: 'Terraform CD Work'

    steps:

    # --------------------------------------------------------
    # CHECKOUT
    # --------------------------------------------------------

    - checkout: self
      displayName: 'Checkout Repository'

    # --------------------------------------------------------
    # DOWNLOAD PLAN
    # --------------------------------------------------------

    - task: DownloadBuildArtifacts@1
      displayName: 'Download Terraform Plan'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'terraform-plan'
        downloadPath: '$(Pipeline.Workspace)'

    # --------------------------------------------------------
    # CHECK DOWNLOADED PLAN
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Check Downloaded Terraform Plan'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "=========================================="
          Write-Host "Downloaded Terraform Plan"
          Write-Host "=========================================="

          Get-ChildItem "$(Pipeline.Workspace)" -Recurse

          $planFile = "$(Pipeline.Workspace)\terraform-plan\tfplan"

          if (-not (Test-Path $planFile)) {
            Write-Host "##[error]Downloaded Terraform plan not found!"
            Write-Host "Expected:"
            Write-Host $planFile
            exit 1
          }

          Write-Host ""
          Write-Host "Terraform plan found:"
          Write-Host $planFile

    # --------------------------------------------------------
    # AZURE LOGIN
    # --------------------------------------------------------

    - task: AzureCLI@3
      displayName: 'Azure CLI Login CD'
      inputs:
        connectionType: 'azureRM'
        azureSubscription: 'shailesh'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Azure Account:"
          az account show

          Write-Host ""
          Write-Host "Resource Groups:"
          az group list --output table

    # --------------------------------------------------------
    # TERRAFORM INSTALL
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: 'latest'

    # --------------------------------------------------------
    # CHECK TERRAFORM DIRECTORY
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Check Terraform Directory CD'
      inputs:
        targetType: 'inline'
        script: |
          $terraformDir = "$(System.DefaultWorkingDirectory)\Azure-Landing-Zone-Terraform_VM\Parent_Module\dev"

          Write-Host "Terraform Directory:"
          Write-Host $terraformDir

          if (-not (Test-Path $terraformDir)) {
            Write-Host "##[error]Terraform directory not found!"
            exit 1
          }

          Write-Host "Terraform directory found."

    # --------------------------------------------------------
    # TERRAFORM INIT CD
    # --------------------------------------------------------

    - task: TerraformTask@5
      displayName: 'Terraform Init CD'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)\Azure-Landing-Zone-Terraform_VM\Parent_Module\dev'
        backendServiceArm: 'shailesh'
        backendAzureRmResourceGroupName: 'sit'
        backendAzureRmStorageAccountName: 'sitterraformstate2026'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'sit.terraform.tfstate'

    # --------------------------------------------------------
    # TERRAFORM APPLY
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Terraform Apply'
      inputs:
        targetType: 'inline'
        script: |
          $terraformDir = "$(System.DefaultWorkingDirectory)\Azure-Landing-Zone-Terraform_VM\Parent_Module\dev"
          $planFile = "$(Pipeline.Workspace)\terraform-plan\tfplan"

          Set-Location $terraformDir

          Write-Host "Current directory:"
          Get-Location

          Write-Host ""
          Write-Host "Plan file:"
          Write-Host $planFile

          if (-not (Test-Path $planFile)) {
            Write-Host "##[error]Terraform plan file not found!"
            exit 1
          }

          Write-Host ""
          Write-Host "Running Terraform Apply..."

          terraform apply `
            -input=false `
            -auto-approve `
            $planFile

          if ($LASTEXITCODE -ne 0) {
            Write-Host "##[error]Terraform apply failed."
            exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Terraform Apply Completed Successfully"
          Write-Host "=========================================="