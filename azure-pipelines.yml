name: azurelandingzoneYMALpipeline

trigger:
- main

pool:
  name: Azurecicd

stages:

# ============================================================
# CI STAGE
# ============================================================

- stage: CI
  displayName: 'Terraform CI'

  jobs:
  - job: CIWork
    displayName: 'Terraform CI Work'

    steps:

    - checkout: self

    - task: AzureCLI@3
      displayName: 'Azure CLI Login'
      inputs:
        connectionType: 'azureRM'
        azureSubscription: 'shailesh'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az account show
          az group list --output table

    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Azure-Landing-Zone-Terraform_VM/Parent_Module/dev'
        backendServiceArm: 'shailesh'
        backendAzureRmResourceGroupName: 'sit'
        backendAzureRmStorageAccountName: 'sitterraformstate2026'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'sit.terraform.tfstate'

    - task: TerraformTask@5
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Azure-Landing-Zone-Terraform_VM/Parent_Module/dev'

    - task: TerraformTask@5
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'shailesh'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Azure-Landing-Zone-Terraform_VM/Parent_Module/dev'
        commandOptions: '-input=false -out="$(Build.ArtifactStagingDirectory)/tfplan'

    - task: PowerShell@2
      displayName: 'Check Terraform Plan File'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "Checking Terraform plan file..."
          Get-ChildItem "$(Build.ArtifactStagingDirectory)" -Recurse

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Terraform Plan'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/tfplan'
        ArtifactName: 'terraform-plan'
        publishLocation: 'Container'


# ============================================================
# CD STAGE
# ============================================================

- stage: CD
  displayName: 'Terraform CD'

  dependsOn: CI
  condition: succeeded()

  jobs:
  - job: CDWork
    displayName: 'Terraform CD Work'

    steps:

    - checkout: self

    - task: DownloadBuildArtifacts@1
      displayName: 'Download Terraform Plan'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'terraform-plan'
        downloadPath: '$(Pipeline.Workspace)'

    - task: PowerShell@2
      displayName: 'Check Downloaded Terraform Plan'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "Downloaded Terraform plan:"
          Get-ChildItem "$(Pipeline.Workspace)" -Recurse

    - task: AzureCLI@3
      displayName: 'Azure CLI Login CD'
      inputs:
        connectionType: 'azureRM'
        azureSubscription: 'shailesh'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az account show
          az group list --output table

    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: 'Terraform Init CD'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Azure-Landing-Zone-Terraform_VM/Parent_Module/dev'
        backendServiceArm: 'shailesh'
        backendAzureRmResourceGroupName: 'sit'
        backendAzureRmStorageAccountName: 'sitterraformstate2026'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'sit.terraform.tfstate'

    - task: TerraformTask@5
      displayName: 'Terraform Apply'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        environmentServiceNameAzureRM: 'shailesh'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Azure-Landing-Zone-Terraform_VM/Parent_Module/dev'
        commandOptions: '"$(Pipeline.Workspace)/terraform-plan/tfplan"'