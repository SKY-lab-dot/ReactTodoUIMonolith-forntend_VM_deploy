name: azurelandingzoneYMALpipeline

trigger:
- main

pool:
  name: Azurecicd

stages:

# ============================================================
# CI STAGE
# ============================================================

- stage: CI
  displayName: 'Terraform CI'

  jobs:

  - job: CIWork
    displayName: 'Terraform CI Work'

    steps:

    # --------------------------------------------------------
    # CHECKOUT
    # --------------------------------------------------------

    - checkout: self
      displayName: 'Checkout Repository'

    # --------------------------------------------------------
    # SHOW REPOSITORY CONTENT
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Find Terraform Files'
      inputs:
        targetType: 'inline'
        script: |

          Write-Host "=========================================="
          Write-Host "Repository Root"
          Write-Host "=========================================="

          Write-Host "$(System.DefaultWorkingDirectory)"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "All Terraform Files"
          Write-Host "=========================================="

          $tfFiles = Get-ChildItem `
            -Path "$(System.DefaultWorkingDirectory)" `
            -Recurse `
            -Filter "*.tf" `
            -File

          if ($tfFiles.Count -eq 0) {

              Write-Host "##[error]No Terraform (.tf) files found in repository!"

              Write-Host ""
              Write-Host "Repository content:"

              Get-ChildItem `
                -Path "$(System.DefaultWorkingDirectory)" `
                -Recurse |
                Select-Object FullName

              exit 1
          }

          foreach ($file in $tfFiles) {
              Write-Host $file.FullName
          }

          # Take directory of first Terraform file
          $terraformDir = $tfFiles[0].DirectoryName

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Terraform Working Directory"
          Write-Host "=========================================="

          Write-Host $terraformDir

          # Save Terraform directory for next tasks
          Write-Host "##vso[task.setvariable variable=TerraformDirectory]$terraformDir"

    # --------------------------------------------------------
    # AZURE LOGIN
    # --------------------------------------------------------

    - task: AzureCLI@3
      displayName: 'Azure CLI Login'
      inputs:
        connectionType: 'azureRM'
        azureSubscription: 'shailesh'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "=========================================="
          Write-Host "Azure Account"
          Write-Host "=========================================="

          az account show

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Resource Groups"
          Write-Host "=========================================="

          az group list --output table

    # --------------------------------------------------------
    # TERRAFORM INSTALL
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: 'latest'

    # --------------------------------------------------------
    # CHECK TERRAFORM DIRECTORY
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Check Terraform Directory'
      inputs:
        targetType: 'inline'
        script: |

          Write-Host "=========================================="
          Write-Host "Terraform Directory"
          Write-Host "=========================================="

          Write-Host "$(TerraformDirectory)"

          if (-not (Test-Path "$(TerraformDirectory)")) {

              Write-Host "##[error]Terraform directory not found!"
              exit 1
          }

          Write-Host ""
          Write-Host "Terraform files:"

          Get-ChildItem "$(TerraformDirectory)" -Filter "*.tf"

    # --------------------------------------------------------
    # TERRAFORM INIT
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Terraform Init'
      inputs:
        targetType: 'inline'
        script: |

          Set-Location "$(TerraformDirectory)"

          Write-Host "=========================================="
          Write-Host "Terraform Version"
          Write-Host "=========================================="

          terraform version

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Terraform Init"
          Write-Host "=========================================="

          terraform init `
            -backend-config="storage_account_name=sitterraformstate2026" `
            -backend-config="container_name=tfstate" `
            -backend-config="key=sit.terraform.tfstate" `
            -backend-config="resource_group_name=sit" `
            -backend-config="subscription_id=5ef4ee5d-6bd4-4c27-acc2-af8816fed413" `
            -backend-config="use_azuread_auth=true"

          if ($LASTEXITCODE -ne 0) {

              Write-Host "##[error]Terraform init failed."
              exit $LASTEXITCODE
          }

    # --------------------------------------------------------
    # TERRAFORM VALIDATE
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Terraform Validate'
      inputs:
        targetType: 'inline'
        script: |

          Set-Location "$(TerraformDirectory)"

          Write-Host "=========================================="
          Write-Host "Terraform Validate"
          Write-Host "=========================================="

          terraform validate

          if ($LASTEXITCODE -ne 0) {

              Write-Host "##[error]Terraform validate failed."
              exit $LASTEXITCODE
          }

    # --------------------------------------------------------
    # TERRAFORM PLAN
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Terraform Plan'
      inputs:
        targetType: 'inline'
        script: |

          Set-Location "$(TerraformDirectory)"

          Write-Host "=========================================="
          Write-Host "Terraform Plan"
          Write-Host "=========================================="

          terraform plan `
            -input=false `
            -out="$(Build.ArtifactStagingDirectory)\tfplan"

          if ($LASTEXITCODE -ne 0) {

              Write-Host "##[error]Terraform plan failed."
              exit $LASTEXITCODE
          }

    # --------------------------------------------------------
    # CHECK PLAN
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Check Terraform Plan File'
      inputs:
        targetType: 'inline'
        script: |

          $planFile = "$(Build.ArtifactStagingDirectory)\tfplan"

          Write-Host "=========================================="
          Write-Host "Terraform Plan File"
          Write-Host "=========================================="

          Write-Host $planFile

          if (-not (Test-Path $planFile)) {

              Write-Host "##[error]Terraform plan file not found!"
              exit 1
          }

          Write-Host "Terraform plan file exists."

          Get-ChildItem `
            "$(Build.ArtifactStagingDirectory)" `
            -Recurse

    # --------------------------------------------------------
    # PUBLISH PLAN
    # --------------------------------------------------------

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Terraform Plan'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)\tfplan'
        ArtifactName: 'terraform-plan'
        publishLocation: 'Container'


# ============================================================
# CD STAGE
# ============================================================

- stage: CD
  displayName: 'Terraform CD'

  dependsOn: CI

  condition: succeeded()

  jobs:

  - job: CDWork
    displayName: 'Terraform CD Work'

    steps:

    # --------------------------------------------------------
    # CHECKOUT
    # --------------------------------------------------------

    - checkout: self
      displayName: 'Checkout Repository'

    # --------------------------------------------------------
    # FIND TERRAFORM FILES AGAIN
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Find Terraform Directory CD'
      inputs:
        targetType: 'inline'
        script: |

          Write-Host "=========================================="
          Write-Host "Searching Terraform Files"
          Write-Host "=========================================="

          $tfFiles = Get-ChildItem `
            -Path "$(System.DefaultWorkingDirectory)" `
            -Recurse `
            -Filter "*.tf" `
            -File

          if ($tfFiles.Count -eq 0) {

              Write-Host "##[error]No Terraform files found!"
              exit 1
          }

          foreach ($file in $tfFiles) {
              Write-Host $file.FullName
          }

          $terraformDir = $tfFiles[0].DirectoryName

          Write-Host ""
          Write-Host "Terraform Directory:"
          Write-Host $terraformDir

          Write-Host "##vso[task.setvariable variable=TerraformDirectory]$terraformDir"

    # --------------------------------------------------------
    # DOWNLOAD PLAN
    # --------------------------------------------------------

    - task: DownloadBuildArtifacts@1
      displayName: 'Download Terraform Plan'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'terraform-plan'
        downloadPath: '$(Pipeline.Workspace)'

    # --------------------------------------------------------
    # CHECK DOWNLOADED PLAN
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Check Downloaded Terraform Plan'
      inputs:
        targetType: 'inline'
        script: |

          Write-Host "=========================================="
          Write-Host "Downloaded Terraform Plan"
          Write-Host "=========================================="

          Get-ChildItem `
            "$(Pipeline.Workspace)" `
            -Recurse

          $planFile = "$(Pipeline.Workspace)\terraform-plan\tfplan"

          if (-not (Test-Path $planFile)) {

              Write-Host "##[error]Terraform plan file not found!"
              Write-Host "Expected:"
              Write-Host $planFile

              exit 1
          }

          Write-Host "Terraform plan found:"
          Write-Host $planFile

    # --------------------------------------------------------
    # AZURE LOGIN
    # --------------------------------------------------------

    - task: AzureCLI@3
      displayName: 'Azure CLI Login CD'
      inputs:
        connectionType: 'azureRM'
        azureSubscription: 'shailesh'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "=========================================="
          Write-Host "Azure Account"
          Write-Host "=========================================="

          az account show

    # --------------------------------------------------------
    # TERRAFORM INSTALL
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: 'latest'

    # --------------------------------------------------------
    # TERRAFORM INIT CD
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Terraform Init CD'
      inputs:
        targetType: 'inline'
        script: |

          Set-Location "$(TerraformDirectory)"

          Write-Host "=========================================="
          Write-Host "Terraform Init CD"
          Write-Host "=========================================="

          terraform init `
            -backend-config="storage_account_name=sitterraformstate2026" `
            -backend-config="container_name=tfstate" `
            -backend-config="key=sit.terraform.tfstate" `
            -backend-config="resource_group_name=sit" `
            -backend-config="subscription_id=5ef4ee5d-6bd4-4c27-acc2-af8816fed413" `
            -backend-config="use_azuread_auth=true"

          if ($LASTEXITCODE -ne 0) {

              Write-Host "##[error]Terraform init CD failed."
              exit $LASTEXITCODE
          }

    # --------------------------------------------------------
    # TERRAFORM APPLY
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Terraform Apply'
      inputs:
        targetType: 'inline'
        script: |

          Set-Location "$(TerraformDirectory)"

          $planFile = "$(Pipeline.Workspace)\terraform-plan\tfplan"

          Write-Host "=========================================="
          Write-Host "Terraform Apply"
          Write-Host "=========================================="

          Write-Host "Terraform Directory:"
          Write-Host "$(TerraformDirectory)"

          Write-Host ""
          Write-Host "Plan File:"
          Write-Host $planFile

          if (-not (Test-Path $planFile)) {

              Write-Host "##[error]Terraform plan file not found!"
              exit 1
          }

          terraform apply `
            -input=false `
            -auto-approve `
            $planFile

          if ($LASTEXITCODE -ne 0) {

              Write-Host "##[error]Terraform apply failed."
              exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Terraform Apply Completed Successfully"
          Write-Host "=========================================="