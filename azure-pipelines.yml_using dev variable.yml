trigger:
  branches:
    include:
    - main
    - features*

pool:
  name: Azurecicd

# =========================================================
# VARIABLE GROUP
# =========================================================

variables:
- group: dev


# =========================================================
# STAGES
# =========================================================

stages:

# =========================================================
# TERRAFORM PIPELINE
# =========================================================

- stage: Terraform
  displayName: 'Terraform Pipeline'

  jobs:

  # =======================================================
  # 1. CI - TERRAFORM INIT
  # =======================================================

  - job: CI
    displayName: 'Terraform Init'

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: '$(TF_VERSION)'

    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: '$(TF_SERVICE_CONNECTION)'
        backendAzureRmResourceGroupName: '$(TF_BACKEND_RG)'
        backendAzureRmStorageAccountName: '$(TF_BACKEND_STORAGE)'
        backendAzureRmContainerName: '$(TF_BACKEND_CONTAINER)'
        backendAzureRmKey: '$(TF_BACKEND_KEY)'


  # =======================================================
  # 2. VALIDATE
  # =======================================================

  - job: Validate
    displayName: 'Terraform Validate'
    dependsOn: CI

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: '$(TF_VERSION)'

    - task: TerraformTask@5
      displayName: 'Terraform Init for Validate'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: '$(TF_SERVICE_CONNECTION)'
        backendAzureRmResourceGroupName: '$(TF_BACKEND_RG)'
        backendAzureRmStorageAccountName: '$(TF_BACKEND_STORAGE)'
        backendAzureRmContainerName: '$(TF_BACKEND_CONTAINER)'
        backendAzureRmKey: '$(TF_BACKEND_KEY)'

    - task: TerraformTask@5
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'


  # =======================================================
  # 3. PLAN
  # =======================================================

  - job: Plan
    displayName: 'Terraform Plan'
    dependsOn: Validate

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: '$(TF_VERSION)'

    - task: TerraformTask@5
      displayName: 'Terraform Init for Plan'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: '$(TF_SERVICE_CONNECTION)'
        backendAzureRmResourceGroupName: '$(TF_BACKEND_RG)'
        backendAzureRmStorageAccountName: '$(TF_BACKEND_STORAGE)'
        backendAzureRmContainerName: '$(TF_BACKEND_CONTAINER)'
        backendAzureRmKey: '$(TF_BACKEND_KEY)'

    - task: TerraformTask@5
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: '$(TF_SERVICE_CONNECTION)'


  # =======================================================
  # 4. CD - TERRAFORM APPLY
  # =======================================================

  - job: CD
    displayName: 'Terraform Apply'
    dependsOn: Plan

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: '$(TF_VERSION)'

    - task: TerraformTask@5
      displayName: 'Terraform Init for Apply'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: '$(TF_SERVICE_CONNECTION)'
        backendAzureRmResourceGroupName: '$(TF_BACKEND_RG)'
        backendAzureRmStorageAccountName: '$(TF_BACKEND_STORAGE)'
        backendAzureRmContainerName: '$(TF_BACKEND_CONTAINER)'
        backendAzureRmKey: '$(TF_BACKEND_KEY)'

    - task: TerraformTask@5
      displayName: 'Terraform Apply'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        environmentServiceNameAzureRM: '$(TF_SERVICE_CONNECTION)'