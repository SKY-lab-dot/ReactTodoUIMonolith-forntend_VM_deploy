trigger:
  branches:
    include:
      - main
      - feature

pr:
  branches:
    include:
      - main

pool:
  name: Azurecicd

variables:
  - group: dev

stages:

# ============================================================
# STAGE 1 - VALIDATE + TFLINT + TFSEC
# ============================================================

- stage: Validate
  displayName: "Terraform Validate & Security"

  jobs:

  - job: ValidateJob
    displayName: "TFLint, tfsec & Terraform Validate"

    steps:

    - checkout: self
      displayName: "Checkout Repository"

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: "latest"

    # --------------------------------------------------------
    # Install TFLint
    # --------------------------------------------------------

    - powershell: |

        Write-Host "Installing TFLint..."

        $version = "v0.59.1"

        $url = "https://github.com/terraform-linters/tflint/releases/download/$version/tflint_windows_amd64.zip"

        $zipPath = "$(Agent.TempDirectory)\tflint.zip"
        $installPath = "$(Agent.TempDirectory)\tflint"

        Invoke-WebRequest `
          -Uri $url `
          -OutFile $zipPath

        Expand-Archive `
          -Path $zipPath `
          -DestinationPath $installPath `
          -Force

        Copy-Item `
          "$installPath\tflint.exe" `
          "$(Agent.ToolsDirectory)\tflint.exe" `
          -Force

        & "$(Agent.ToolsDirectory)\tflint.exe" --version

      displayName: "Install TFLint"

    # --------------------------------------------------------
    # Run TFLint
    # --------------------------------------------------------

    - powershell: |

        Write-Host "Running TFLint..."

        Set-Location "$(Build.SourcesDirectory)"

        & "$(Agent.ToolsDirectory)\tflint.exe" --init

        if ($LASTEXITCODE -ne 0) {
          Write-Error "TFLint initialization failed."
          exit 1
        }

        & "$(Agent.ToolsDirectory)\tflint.exe"

        if ($LASTEXITCODE -ne 0) {
          Write-Error "TFLint found issues."
          exit 1
        }

        Write-Host "TFLint completed successfully."

      displayName: "Run TFLint"

    # --------------------------------------------------------
    # Install tfsec
    # --------------------------------------------------------

    - powershell: |

        Write-Host "Installing tfsec..."

        $version = "v1.28.14"

        $url = "https://github.com/aquasecurity/tfsec/releases/download/$version/tfsec-windows-amd64.exe"

        $tfsecPath = "$(Agent.ToolsDirectory)\tfsec.exe"

        Invoke-WebRequest `
          -Uri $url `
          -OutFile $tfsecPath

        & $tfsecPath --version

      displayName: "Install tfsec"

    # --------------------------------------------------------
    # Run tfsec
    # --------------------------------------------------------

    - powershell: |

        Write-Host "Running tfsec security scan..."

        Set-Location "$(Build.SourcesDirectory)"

        & "$(Agent.ToolsDirectory)\tfsec.exe" .

        if ($LASTEXITCODE -ne 0) {
          Write-Error "tfsec found security issues."
          exit 1
        }

        Write-Host "tfsec completed successfully."

      displayName: "Run tfsec"

    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: TerraformTask@5
      displayName: "Terraform Init"
      inputs:
        provider: "azurerm"
        command: "init"

        backendServiceArm: "shailesh"

        backendAzureRmResourceGroupName: "sit"

        backendAzureRmStorageAccountName: "sitterraformstate2026"

        backendAzureRmContainerName: "tfstate"

        backendAzureRmKey: "sit.terraform.tfstate"

    # --------------------------------------------------------
    # Terraform Validate
    # --------------------------------------------------------

    - task: TerraformTask@5
      displayName: "Terraform Validate"
      inputs:
        provider: "azurerm"
        command: "validate"


# ============================================================
# STAGE 2 - TERRAFORM PLAN
# ============================================================

- stage: Plan
  displayName: "Terraform Plan"

  dependsOn: Validate

  condition: succeeded()

  jobs:

  - job: PlanJob
    displayName: "Terraform Plan"

    steps:

    - checkout: self
      displayName: "Checkout Repository"

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: "latest"

    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: TerraformTask@5
      displayName: "Terraform Init"
      inputs:
        provider: "azurerm"
        command: "init"

        backendServiceArm: "shailesh"

        backendAzureRmResourceGroupName: "sit"

        backendAzureRmStorageAccountName: "sitterraformstate2026"

        backendAzureRmContainerName: "tfstate"

        backendAzureRmKey: "sit.terraform.tfstate"

    # --------------------------------------------------------
    # Terraform Plan
    # --------------------------------------------------------

    - task: TerraformTask@5
      displayName: "Terraform Plan"
      inputs:
        provider: "azurerm"
        command: "plan"

        environmentServiceNameAzureRM: "shailesh"

        commandOptions: "-out=$(Build.ArtifactStagingDirectory)/tfplan"

    # --------------------------------------------------------
    # Publish Terraform Plan
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: "Publish Terraform Plan"
      inputs:
        targetPath: "$(Build.ArtifactStagingDirectory)/tfplan"
        artifact: "terraform-plan"


# ============================================================
# STAGE 3 - MANUAL APPROVAL
# ============================================================

- stage: Approval
  displayName: "Manual Approval - Terraform Apply"

  dependsOn: Plan

  condition: succeeded()

  jobs:

  - job: ManualApproval
    displayName: "Waiting for Terraform Apply Approval"

    pool: server

    timeoutInMinutes: 1440

    steps:

    - task: ManualValidation@0
      displayName: "Approve Terraform Apply"

      timeoutInMinutes: 1440

      inputs:

        notifyUsers: |
          $(Build.RequestedForEmail)

        instructions: |
          ================================================
          TERRAFORM MANUAL APPROVAL REQUIRED
          ================================================

          Terraform Plan has completed successfully.

          Please review the Terraform Plan artifact:

          Artifact Name:
          terraform-plan

          If the Terraform changes are correct,
          approve this validation.

          After approval, Terraform Apply will start.

          If the changes are not correct,
          reject this validation.

        onTimeout: "reject"


# ============================================================
# STAGE 4 - TERRAFORM APPLY
# ============================================================

- stage: Apply
  displayName: "Terraform Apply"

  dependsOn: Approval

  condition: succeeded()

  jobs:

  - job: ApplyJob
    displayName: "Terraform Apply"

    steps:

    - checkout: self
      displayName: "Checkout Repository"

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: "Install Terraform"

      inputs:
        terraformVersion: "latest"

    # --------------------------------------------------------
    # Download Approved Terraform Plan
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: "Download Terraform Plan"

      inputs:
        buildType: "current"

        artifactName: "terraform-plan"

        targetPath: "$(Pipeline.Workspace)/terraform-plan"

    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: TerraformTask@5
      displayName: "Terraform Init"

      inputs:
        provider: "azurerm"

        command: "init"

        backendServiceArm: "shailesh"

        backendAzureRmResourceGroupName: "sit"

        backendAzureRmStorageAccountName: "sitterraformstate2026"

        backendAzureRmContainerName: "tfstate"

        backendAzureRmKey: "sit.terraform.tfstate"

    # --------------------------------------------------------
    # Terraform Apply
    # --------------------------------------------------------

    - task: TerraformTask@5
      displayName: "Terraform Apply Approved Plan"

      inputs:
        provider: "azurerm"

        command: "apply"

        environmentServiceNameAzureRM: "shailesh"

        commandOptions: "$(Pipeline.Workspace)/terraform-plan/tfplan"