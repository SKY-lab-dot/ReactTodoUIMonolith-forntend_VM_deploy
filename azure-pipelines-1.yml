trigger:
  branches:
    include:
      - main
      - feature

pr:
  branches:
    include:
      - main

pool:
  name: Azurecicd

variables:
  - group: dev

stages:

# ============================================================
# STAGE 1 - TFLINT + TFSEC + TERRAFORM VALIDATE
# ============================================================

- stage: Validate
  displayName: "Terraform Validate & Security"

  jobs:

  - job: ValidateJob
    displayName: "TFLint, tfsec & Terraform Validate"

    steps:

    - checkout: self
      displayName: "Checkout Repository"

    # ========================================================
    # Install Terraform
    # ========================================================

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: "latest"

    # ========================================================
    # Install TFLint
    # ========================================================

    - powershell: |

        Write-Host "========================================="
        Write-Host "Installing TFLint"
        Write-Host "========================================="

        $version = "v0.59.1"

        $url = "https://github.com/terraform-linters/tflint/releases/download/$version/tflint_windows_amd64.zip"

        $zipPath = "$(Agent.TempDirectory)\tflint.zip"
        $installPath = "$(Agent.TempDirectory)\tflint"

        Write-Host "Downloading TFLint from:"
        Write-Host $url

        Invoke-WebRequest `
          -Uri $url `
          -OutFile $zipPath

        Write-Host "Extracting TFLint..."

        Expand-Archive `
          -Path $zipPath `
          -DestinationPath $installPath `
          -Force

        Write-Host "Copying TFLint executable..."

        Copy-Item `
          "$installPath\tflint.exe" `
          "$(Agent.ToolsDirectory)\tflint.exe" `
          -Force

        Write-Host "TFLint Version:"

        & "$(Agent.ToolsDirectory)\tflint.exe" --version

      displayName: "Install TFLint"

    # ========================================================
    # Run TFLint
    # ========================================================

    - powershell: |

        Write-Host "========================================="
        Write-Host "Running TFLint"
        Write-Host "========================================="

        Set-Location "$(Build.SourcesDirectory)"

        Write-Host "Initializing TFLint..."

        & "$(Agent.ToolsDirectory)\tflint.exe" --init

        if ($LASTEXITCODE -ne 0) {
            Write-Error "TFLint initialization failed."
            exit 1
        }

        Write-Host "Running TFLint scan..."

        & "$(Agent.ToolsDirectory)\tflint.exe"

        if ($LASTEXITCODE -ne 0) {
            Write-Error "TFLint found issues."
            exit 1
        }

        Write-Host "TFLint scan completed successfully."

      displayName: "Run TFLint"

    # ========================================================
    # Install tfsec
    # ========================================================

    - powershell: |

        Write-Host "========================================="
        Write-Host "Installing tfsec"
        Write-Host "========================================="

        $version = "v1.28.14"

        $url = "https://github.com/aquasecurity/tfsec/releases/download/$version/tfsec-windows-amd64.exe"

        $tfsecPath = "$(Agent.ToolsDirectory)\tfsec.exe"

        Write-Host "Downloading tfsec from:"
        Write-Host $url

        Invoke-WebRequest `
          -Uri $url `
          -OutFile $tfsecPath

        Write-Host "tfsec Version:"

        & $tfsecPath --version

      displayName: "Install tfsec"

    # ========================================================
    # Run tfsec
    # ========================================================

    - powershell: |

        Write-Host "========================================="
        Write-Host "Running tfsec Security Scan"
        Write-Host "========================================="

        Set-Location "$(Build.SourcesDirectory)"

        & "$(Agent.ToolsDirectory)\tfsec.exe" .

        if ($LASTEXITCODE -ne 0) {
            Write-Error "tfsec found security issues."
            exit 1
        }

        Write-Host "tfsec security scan completed successfully."

      displayName: "Run tfsec"

    # ========================================================
    # Terraform Init
    # ========================================================

    - task: TerraformTask@5
      displayName: "Terraform Init"
      inputs:
        provider: "azurerm"
        command: "init"

        backendServiceArm: "shailesh"

        backendAzureRmResourceGroupName: "sit"

        backendAzureRmStorageAccountName: "sitterraformstate2026"

        backendAzureRmContainerName: "tfstate"

        backendAzureRmKey: "sit.terraform.tfstate"

    # ========================================================
    # Terraform Validate
    # ========================================================

    - task: TerraformTask@5
      displayName: "Terraform Validate"
      inputs:
        provider: "azurerm"
        command: "validate"


# ============================================================
# STAGE 2 - TERRAFORM PLAN
# ============================================================

- stage: Plan
  displayName: "Terraform Plan"

  dependsOn: Validate

  condition: succeeded()

  jobs:

  - job: PlanJob
    displayName: "Terraform Plan"

    steps:

    - checkout: self
      displayName: "Checkout Repository"

    # ========================================================
    # Install Terraform
    # ========================================================

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: "latest"

    # ========================================================
    # Terraform Init
    # ========================================================

    - task: TerraformTask@5
      displayName: "Terraform Init"
      inputs:
        provider: "azurerm"
        command: "init"

        backendServiceArm: "shailesh"

        backendAzureRmResourceGroupName: "sit"

        backendAzureRmStorageAccountName: "sitterraformstate2026"

        backendAzureRmContainerName: "tfstate"

        backendAzureRmKey: "sit.terraform.tfstate"

    # ========================================================
    # Terraform Plan
    # ========================================================

    - task: TerraformTask@5
      displayName: "Terraform Plan"
      inputs:
        provider: "azurerm"
        command: "plan"

        environmentServiceNameAzureRM: "shailesh"

        commandOptions: "-out=$(Build.ArtifactStagingDirectory)/tfplan"

    # ========================================================
    # Publish Terraform Plan
    # ========================================================

    - task: PublishPipelineArtifact@1
      displayName: "Publish Terraform Plan"
      inputs:
        targetPath: "$(Build.ArtifactStagingDirectory)/tfplan"
        artifact: "terraform-plan"


# ============================================================
# STAGE 3 - MANUAL APPROVAL
# ============================================================

- stage: Approval
  displayName: "Manual Approval"

  dependsOn: Plan

  condition: succeeded()

  jobs:

  - job: ManualApproval
    displayName: "Waiting for Manual Approval"

    pool: server

    steps:

    - task: ManualValidation@0
      displayName: "Approve Terraform Apply"

      timeoutInMinutes: 1440

      inputs:

        notifyUsers: |
          $(Build.RequestedForEmail)

        instructions: |
          Terraform Plan has completed successfully.

          Please review the Terraform Plan before approving.

          Approve this validation to continue with Terraform Apply.

        onTimeout: "reject"


# ============================================================
# STAGE 4 - TERRAFORM APPLY
# ============================================================

- stage: Apply
  displayName: "Terraform Apply"

  dependsOn: Approval

  condition: succeeded()

  jobs:

  - job: ApplyJob
    displayName: "Terraform Apply"

    steps:

    - checkout: self
      displayName: "Checkout Repository"

    # ========================================================
    # Install Terraform
    # ========================================================

    - task: TerraformInstaller@1
      displayName: "Install Terraform"

      inputs:
        terraformVersion: "latest"

    # ========================================================
    # Download Approved Plan
    # ========================================================

    - task: DownloadPipelineArtifact@2
      displayName: "Download Terraform Plan"

      inputs:
        buildType: "current"

        artifactName: "terraform-plan"

        targetPath: "$(Pipeline.Workspace)/terraform-plan"

    # ========================================================
    # Terraform Init
    # ========================================================

    - task: TerraformTask@5
      displayName: "Terraform Init"

      inputs:
        provider: "azurerm"

        command: "init"

        backendServiceArm: "shailesh"

        backendAzureRmResourceGroupName: "sit"

        backendAzureRmStorageAccountName: "sitterraformstate2026"

        backendAzureRmContainerName: "tfstate"

        backendAzureRmKey: "sit.terraform.tfstate"

    # ========================================================
    # Terraform Apply Approved Plan
    # ========================================================

    - task: TerraformTask@5
      displayName: "Terraform Apply Approved Plan"

      inputs:
        provider: "azurerm"

        command: "apply"

        environmentServiceNameAzureRM: "shailesh"

        commandOptions: "$(Pipeline.Workspace)/terraform-plan/tfplan"